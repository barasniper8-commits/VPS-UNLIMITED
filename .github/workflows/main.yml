name: Windows RDP Pro - Arianto Lumajang

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    steps:
      - name: Tampilkan Logo & Info Pemilik
        run: |
          Write-Host "==========================================================================================" -ForegroundColor Cyan
          Write-Host "    _    ____ ___    _    _   _ _____ ___   _        _   _   _ __  __    _    _   _ _   _ ___ _   _   " -ForegroundColor Yellow
          Write-Host "   / \  |  _ \_ _|  / \  | \ | |_   _/ _ \ / \      | | | | | |  \/  |  / \  | \ | | | | |_ _| \ | |  " -ForegroundColor Yellow
          Write-Host "  / _ \ | |_) | |  / _ \ |  \| | | || | | / _ \     | | | | | | |\/| | / _ \ |  \| | | | || ||  \| |  " -ForegroundColor Yellow
          Write-Host " / ___ \|  _ <| | / ___ \| |\  | | || |_| / ___ \    | | |_| |_| |  | |/ ___ \| |\  | |_| || || |\  |  " -ForegroundColor Yellow
          Write-Host "/_/   \_\_| \_\___/_/   \_\_| \_| |_| \___/_/   \_\_\  \___/\___/|_|  |_/_/   \_\__| \_|\___/|___|_| \_|  " -ForegroundColor Yellow
          Write-Host "==========================================================================================" -ForegroundColor Cyan
          Write-Host "  LOKASI: Lumajang, Indonesia" -ForegroundColor Green
          Write-Host "  STATUS: Menyiapkan VPS Windows RAM 16GB & Konfigurasi Sistem..." -ForegroundColor Green
          Write-Host "==========================================================================================" -ForegroundColor Cyan
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
          Get-CimInstance Win32_Processor | Select-Object Name

      - name: Setup Tailscale Service & Stable Connection
        run: |
          Write-Host "Menginstal Tailscale..."
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
          Start-Service Tailscale
          Write-Host "Menghubungkan ke Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="tskey-auth-kHTTWE1Nfa11CNTRL-NwGRWfVA1TVh5BUvtvmzSVxuB1z8uXeQH" --accept-routes --unattended

      - name: Install Google Chrome Otomatis
        run: |
          Write-Host "Mengunduh dan menginstal Google Chrome..."
          $installer = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/silent /install" -Wait
          Write-Host "Google Chrome berhasil diinstal."

      - name: Konfigurasi RDP, Firewall & Power Options
        run: |
          net user runneradmin "AriantoLumajang123!@"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1
          
          # Mencegah VPS masuk mode sleep/hibernate
          powercfg -change -standby-timeout-ac 0
          powercfg -change -monitor-timeout-ac 0

      - name: Tampilkan IP Tailscale
        run: |
          Write-Host "==================================================================" -ForegroundColor Green
          Write-Host "=== IP ADDRESS TAILSCALE (ARIANTO LUMAJANG) ===" -ForegroundColor Green
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=== RDP SIAP DIGUNAKAN ===" -ForegroundColor Green
          Write-Host "==================================================================" -ForegroundColor Green

      - name: Keep Alive & Auto-Reconnect Monitor (6 Jam)
        run: |
          Write-Host "VPS aktif. Memantau koneksi Tailscale secara berkala..."
          while ($true) {
            & "C:\Program Files\Tailscale\tailscale.exe" status | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Tailscale terdeteksi terputus, mencoba menyambungkan ulang..."
              & "C:\Program Files\Tailscale\tailscale.exe" up --unattended
            }
            Start-Sleep -Seconds 60
          }
