name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    steps:
      - name: Info Pemilik VPS (Arianto Lumajang)
        run: |
          Write-Host "=========================================="
          Write-Host "  VPS RDP MILIK: Arianto Lumajang"
          Write-Host "  LOKASI: Lumajang, Indonesia"
          Write-Host "=========================================="
          Write-Host "=== SPESIFIKASI MESIN (RAM 16GB) ==="
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
          Get-CimInstance Win32_Processor | Select-Object Name

      - name: Ambil & Pasang Proxy Singapura Otomatis
        run: |
          Write-Host "Mencari proxy publik gratis Singapura..."
          try {
              $response = Invoke-RestMethod -Uri "https://proxylist.geonode.com/api/proxy-list?limit=1&page=1&country=SG&protocols=http" -TimeoutSec 10
              $proxyIp = $response.data[0].ip
              $proxyPort = $response.data[0].port
              
              Write-Host "Berhasil mendapatkan Proxy SG: $proxyIp`:$proxyPort"
              
              # Set system-wide proxy di Windows
              netsh winhttp set proxy proxy-server="$proxyIp`:$proxyPort"
              Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -Name ProxyEnable -Value 1
              Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -Name ProxyServer -Value "$proxyIp`:$proxyPort"
          } catch {
              Write-Host "Gagal mengambil proxy otomatis, melanjutkan tanpa proxy..." -ForegroundColor Yellow
          }

      - name: Konfigurasi RDP & Password
        run: |
          net user runneradmin "AriantoLumajang123!@"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Verifikasi IP & Lokasi Saat Ini
        run: |
          Write-Host "=== MENGECEK IP & LOKASI SAAT INI ==="
          try {
              $ipInfo = Invoke-RestMethod -Uri "http://ip-api.com/json" -TimeoutSec 5
              Write-Host "IP: $($ipInfo.query)"
              Write-Host "Negara: $($ipInfo.country)"
          } catch {
              Write-Host "Gagal mengecek IP."
          }

      - name: Keep Alive (Sesi Aktif 6 Jam)
        run: |
          Write-Host "RDP Arianto Lumajang Siap Digunakan."
          while ($true) { Start-Sleep -Seconds 300 }
