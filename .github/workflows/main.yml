name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    steps:
      - name: Info Pemilik VPS (Arianto Lumajang)
        run: |
          Write-Host "=========================================="
          Write-Host "  VPS RDP MILIK: Arianto Lumajang"
          Write-Host "  LOKASI: Lumajang, Indonesia"
          Write-Host "=========================================="
          Write-Host "=== SPESIFIKASI MESIN (RAM 16GB) ==="
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
          Get-CimInstance Win32_Processor | Select-Object Name

      - name: Install & Setup Tailscale via Winget
        run: |
          Write-Host "Menginstal Tailscale menggunakan Winget..."
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
          
          Write-Host "Menghubungkan ke Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="tskey-auth-kKvMgfP8p921CNTRL-9byE8mDmFATnjsHYzeNFATpqofVKB6g78" --accept-routes

      - name: Konfigurasi RDP & Password
        run: |
          net user runneradmin "AriantoLumajang123!@"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Tampilkan IP Tailscale
        run: |
          Write-Host "=== GUNAKAN IP DI BAWAH INI UNTUK LOGIN RDP (Arianto Lumajang) ==="
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Keep Alive (Sesi Aktif 6 Jam)
        run: |
          Write-Host "RDP Arianto Lumajang Siap Digunakan. Cek log 'Tampilkan IP Tailscale' untuk melihat IP."
          while ($true) { Start-Sleep -Seconds 300 }
