name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: "Masukkan Tailscale Auth Key"
        required: true
        type: string

      rdp_password:
        description: "Masukkan Password RDP"
        required: true
        type: string

jobs:
  windows-rdp:
    runs-on: windows-latest

    steps:
      - name: Info RDP Arianto
        shell: powershell
        run: |
Write-Host ""
Write-Host ' \'                      .:!!!!!!!!:.'
Write-Host '.!!!!!:.'              :!!!!!!!!!!!!!!!'
Write-Host '~~!!~~!!:.'         .:!!!!!!!!!!UMM$$$$'
Write-Host ':$$NWXI!:'       .:!!!!!!XUW^$$$$$$$$$$P'
Write-Host '$$$$$^$$WX!:' .<!!!!UN$$$"   $$$$$$$$#'
Write-Host '$$$$   $$$`UX':!!UW$$$$$$$   4$$$$*'
Write-Host '  ^$$$ $$$$\'   $$$$$$$$$$$ d$$R"'
Write-Host '    "*$bd$$$$' '*$$$$$$$$$$O+#"'
Write-Host "   ''''''''"      '''''''''"
Write-Host ""
          

          Write-Host "=========================================="
          Write-Host "        RDP WINDOWS 11 : ARIANTO"
          Write-Host "=========================================="

          $ram = [math]::Round(
            (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
            2
          )

          Write-Host "RAM         : $ram GB"
          Write-Host "JAM MULAI   : $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host "JAM AKHIR   : Sampai runner dihentikan"
          Write-Host "=========================================="
          Write-Host "----- copyright©arianto2026 ----"
          Write-Host ""

      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
        run: |
          Write-Host "Menginstal Tailscale..."

          winget install --id Tailscale.Tailscale -e `
            --accept-source-agreements `
            --accept-package-agreements

          Start-Service Tailscale

          Write-Host "Menghubungkan Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTHKEY" `
            --unattended

      - name: Konfigurasi RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |
          Write-Host "Mengaktifkan RDP..."

          net user runneradmin "$env:RDP_PASSWORD"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1

          Write-Host "RDP berhasil diaktifkan."

      - name: Tampilkan Informasi Login
        shell: powershell
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "        RDP WINDOWS 11 : ARIANTO"
          Write-Host "=========================================="
          Write-Host "IP RDP      : $ip"
          Write-Host "USERNAME    : runneradmin"
          Write-Host "PASSWORD    : Password yang dimasukkan"
          Write-Host "=========================================="
          Write-Host "RAM         : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)) GB"
          Write-Host "JAM MULAI   : $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host "JAM AKHIR   : Runner dihentikan oleh GitHub"
          Write-Host "=========================================="
          Write-Host "----- copyright©arianto2026 ----"
          Write-Host ""

      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host "RDP ARIANTO SIAP DIGUNAKAN."
          Write-Host "Jangan tutup workflow selama RDP digunakan."

          while ($true) {
            Start-Sleep -Seconds 300
          }