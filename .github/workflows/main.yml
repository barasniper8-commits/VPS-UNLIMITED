name: Windows RDP Pro - Arianto Lumajang

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. INFORMASI SISTEM
      # ==========================================================
      - name: Info Sistem
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       WINDOWS RDP PRO - ARIANTO LUMAJANG"
          Write-Host "=============================================="

          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

          Write-Host "Computer : $($cs.Name)"
          Write-Host "Windows  : $($os.Caption)"
          Write-Host "Version  : $($os.Version)"
          Write-Host "CPU      : $($cpu.Name)"
          Write-Host "Core     : $($cpu.NumberOfCores)"
          Write-Host "RAM      : $([math]::Round($cs.TotalPhysicalMemory / 1GB,2)) GB"
          Write-Host "Disk     : $([math]::Round($disk.Size / 1GB,2)) GB"
          Write-Host "Free Disk: $([math]::Round($disk.FreeSpace / 1GB,2)) GB"

          Write-Host "=============================================="

      # ==========================================================
      # 2. CEK WINGET
      # ==========================================================
      - name: Cek Winget
        shell: powershell
        run: |
          Write-Host "Memeriksa Windows Package Manager..."
          winget --version
          Write-Host "Winget siap."

      # ==========================================================
      # 3. INSTALL TAILSCALE
      # ==========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Menginstal Tailscale..."

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

          Start-Sleep -Seconds 10

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
              Write-Host "Tailscale gagal ditemukan."
              exit 1
          }

          Write-Host "Tailscale berhasil diinstal."

      # ==========================================================
      # 4. START TAILSCALE SERVICE
      # ==========================================================
      - name: Start Tailscale Service
        shell: powershell
        run: |
          $service = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
              Write-Host "Service Tailscale tidak ditemukan."
              exit 1
          }

          Set-Service `
            -Name "Tailscale" `
            -StartupType Automatic

          if ($service.Status -ne "Running") {
              Start-Service `
                -Name "Tailscale"
          }

          Start-Sleep -Seconds 5

          Get-Service Tailscale

      # ==========================================================
      # 5. CONNECT TAILSCALE
      # ==========================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: "tskey-auth-kvYRkh8jPL11CNTRL-3ZmXJNwE5a2UHvKGpR95a2FTaMNQacNDR"
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Menghubungkan ke Tailscale..."

          & $ts up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --accept-routes `
            --unattended

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "========== TAILSCALE STATUS =========="

          & $ts status

      # ==========================================================
      # 6. AKTIFKAN REMOTE DESKTOP
      # ==========================================================
      - name: Aktifkan Remote Desktop
        shell: powershell
        run: |
          Write-Host "Mengaktifkan Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP berhasil diaktifkan."

      # ==========================================================
      # 7. KONFIGURASI USER RDP
      # ==========================================================
      - name: Konfigurasi User RDP
        shell: powershell
        env:
          RDP_USERNAME: "runneradmin"
          RDP_PASSWORD: "GANTI_DENGAN_PASSWORD_BARU"
        run: |

          $username = $env:RDP_USERNAME

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Write-Host "Menyiapkan user RDP..."

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              New-LocalUser `
                -Name $username `
                -Password $password `
                -FullName "RDP User" `
                -Description "Windows RDP User"

              Write-Host "User baru dibuat."

          } else {

              Set-LocalUser `
                -Name $username `
                -Password $password

              Write-Host "Password user diperbarui."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "User RDP siap digunakan."

      # ==========================================================
      # 8. TAMPILKAN AKUN LOGIN RDP
      # ==========================================================
      - name: Tampilkan Akun Login RDP
        shell: powershell
        env:
          RDP_USERNAME: "runneradmin"
          RDP_PASSWORD: "AriantoLumajang123!@"
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              AKUN LOGIN RDP"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "User     : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=============================================="

      # ==========================================================
      # 9. POWER PERFORMANCE
      # ==========================================================
      - name: Optimasi Power
        shell: powershell
        run: |
          Write-Host "Mengatur Power Plan..."

          powercfg /setactive SCHEME_MIN

          powercfg -change -standby-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -disk-timeout-ac 0

          powercfg /hibernate off

          Write-Host "Power plan Performance aktif."

      # ==========================================================
      # 10. FIREWALL RDP
      # ==========================================================
      - name: Konfigurasi Firewall RDP
        shell: powershell
        run: |
          Write-Host "Mengaktifkan Firewall RDP..."

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Select-Object DisplayName, Enabled, Profile

      # ==========================================================
      # 11. INSTALL GOOGLE CHROME
      # ==========================================================
      - name: Install Google Chrome
        shell: powershell
        run: |
          Write-Host "Menginstal Google Chrome..."

          $installer = "$env:TEMP\chrome_installer.exe"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/silent /install" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Google Chrome berhasil diinstal."

      # ==========================================================
      # 12. INSTALL VISUAL STUDIO CODE
      # ==========================================================
      - name: Install Visual Studio Code
        shell: powershell
        run: |
          Write-Host "Menginstal Visual Studio Code..."

          winget install `
            --id Microsoft.VisualStudioCode `
            -e `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

          Write-Host "VS Code selesai."

      # ==========================================================
      # 13. OPTIMASI WINDOWS
      # ==========================================================
      - name: Optimasi Windows
        shell: powershell
        run: |
          Write-Host "Melakukan optimasi Windows..."

          $services = @(
            "DiagTrack",
            "MapsBroker",
            "Fax"
          )

          foreach ($svc in $services) {

              $obj = Get-Service `
                -Name $svc `
                -ErrorAction SilentlyContinue

              if ($null -ne $obj) {

                  Stop-Service `
                    -Name $svc `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Set-Service `
                    -Name $svc `
                    -StartupType Disabled `
                    -ErrorAction SilentlyContinue
              }
          }

          Write-Host "Optimasi selesai."

      # ==========================================================
      # 14. CEK RDP PORT
      # ==========================================================
      - name: Cek Port RDP
        shell: powershell
        run: |
          Write-Host "Memeriksa port RDP 3389..."

          $result = Test-NetConnection `
            -ComputerName localhost `
            -Port 3389

          Write-Host ""
          Write-Host "Port 3389:"
          Write-Host "TCP Connected = $($result.TcpTestSucceeded)"

          if (!$result.TcpTestSucceeded) {

              Write-Host "RDP belum listening."

          } else {

              Write-Host "RDP LISTENING."
          }

      # ==========================================================
      # 15. TAMPILKAN IP TAILSCALE + DATA LOGIN
      # ==========================================================
      - name: Tampilkan Data RDP Lengkap
        shell: powershell
        env:
          RDP_USERNAME: "runneradmin"
          RDP_PASSWORD: "GANTI_DENGAN_PASSWORD_BARU"
        run: |

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = & $ts ip -4

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "           WINDOWS RDP PRO READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Tailscale IP : $ip"
          Write-Host "RDP Port     : 3389"
          Write-Host "User         : $env:RDP_USERNAME"
          Write-Host "Password     : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Software:"
          Write-Host "- Tailscale"
          Write-Host "- Google Chrome"
          Write-Host "- Visual Studio Code"
          Write-Host ""
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Tailscale Status:"
          & $ts status

      # ==========================================================
      # 16. HEALTH MONITOR
      # ==========================================================
      - name: RDP Health Monitor
        shell: powershell
        run: |

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP HEALTH MONITOR AKTIF"
          Write-Host "=============================================="

          $end = (Get-Date).AddMinutes(330)

          while ((Get-Date) -lt $end) {

              Write-Host ""
              Write-Host "----------------------------------------------"
              Write-Host "TIME: $(Get-Date)"

              # CPU
              $cpu = Get-CimInstance Win32_Processor |
                     Measure-Object -Property LoadPercentage -Average

              Write-Host "CPU : $([math]::Round($cpu.Average,1))%"

              # RAM
              $os = Get-CimInstance Win32_OperatingSystem

              $totalRam = $os.TotalVisibleMemorySize
              $freeRam = $os.FreePhysicalMemory

              $usedRam =
                (($totalRam - $freeRam) / $totalRam) * 100

              Write-Host "RAM : $([math]::Round($usedRam,1))%"

              # DISK
              $disk = Get-CimInstance Win32_LogicalDisk `
                -Filter "DeviceID='C:'"

              $diskUsed =
                (($disk.Size - $disk.FreeSpace) / $disk.Size) * 100

              Write-Host "DISK: $([math]::Round($diskUsed,1))%"

              # TAILSCALE
              $service = Get-Service `
                -Name Tailscale `
                -ErrorAction SilentlyContinue

              Write-Host "Tailscale: $($service.Status)"

              if ($service.Status -ne "Running") {

                  Write-Host "Tailscale berhenti."
                  Write-Host "Menjalankan kembali..."

                  Start-Service Tailscale

                  Start-Sleep -Seconds 5

                  & $ts up --unattended
              }

              # RDP SERVICE
              $rdpService = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              Write-Host "RDP Service: $($rdpService.Status)"

              if ($rdpService.Status -ne "Running") {

                  Write-Host "RDP Service berhenti."
                  Write-Host "Restarting..."

                  Start-Service `
                    -Name TermService `
                    -ErrorAction SilentlyContinue
              }

              # RDP PORT
              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($null -eq $rdp) {

                  Write-Host "RDP PORT: NOT LISTENING"

                  Restart-Service `
                    -Name TermService `
                    -Force `
                    -ErrorAction SilentlyContinue

              } else {

                  Write-Host "RDP PORT: LISTENING"
              }

              Write-Host "STATUS: SERVER HEALTHY"

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       MONITORING SELESAI"
          Write-Host "=============================================="
