name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    steps:
      - name: Info Pemilik VPS (Arianto Lumajang)
        run: |
          Write-Host "=========================================="
          Write-Host "  VPS RDP MILIK: Arianto Lumajang"
          Write-Host "  LOKASI: Lumajang, Indonesia"
          Write-Host "=========================================="
          Write-Host "=== SPESIFIKASI MESIN (RAM 16GB) ==="
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
          Get-CimInstance Win32_Processor | Select-Object Name

      - name: Coba Proxy Singapura, Fallback ke Tailscale Jika Gagal
        run: |
          $success = $false
          try {
              Write-Host "Mencari proxy publik gratis Singapura..."
              $response = Invoke-RestMethod -Uri "https://proxylist.geonode.com/api/proxy-list?limit=1&page=1&country=SG&protocols=http" -TimeoutSec 10
              if ($response.data.Count -gt 0) {
                  $proxyIp = $response.data[0].ip
                  $proxyPort = $response.data[0].port
                  
                  Write-Host "Mencoba Proxy SG: $proxyIp`:$proxyPort"
                  netsh winhttp set proxy proxy-server="$proxyIp`:$proxyPort"
                  Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -Name ProxyEnable -Value 1
                  Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -Name ProxyServer -Value "$proxyIp`:$proxyPort"
                  
                  # Verifikasi lokasi IP aktual
                  $ipInfo = Invoke-RestMethod -Uri "http://ip-api.com/json" -TimeoutSec 5
                  if ($ipInfo.country -eq "Singapore") {
                      Write-Host "Berhasil mendapatkan IP Singapura via Proxy!" -ForegroundColor Green
                      $success = $true
                  } else {
                      Write-Host "Proxy terdeteksi di negara: $($ipInfo.country), bukan Singapura." -ForegroundColor Yellow
                  }
              }
          } catch {
              Write-Host "Gagal mengambil proxy otomatis." -ForegroundColor Yellow
          }

          if (-not $success) {
              Write-Host "=== PROXY GAGAL/TIDAK VALID, MENGALIHKAN KE TAILSCALE ===" -ForegroundColor Cyan
              winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements --silent
              
              Write-Host "Menunggu instalasi Tailscale selesai..."
              Start-Sleep -Seconds 15
              
              # Deteksi otomatis jalur direktori Tailscale (ProgramFiles atau ProgramFiles(x86))
              $tsPath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
              if (-not (Test-Path $tsPath)) {
                  $tsPath = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
              }
              
              if (Test-Path $tsPath) {
                  Write-Host "Menjalankan Tailscale dari: $tsPath"
                  & $tsPath up --authkey="tskey-auth-kaY8zm1zxB21CNTRL-xjY8VLMnFvhPuxpMxegFvhpcbD42xDVDM" --unattended
              } else {
                  Write-Host "Gagal menemukan file eksekusi Tailscale." -ForegroundColor Red
              }
          }

      - name: Konfigurasi RDP & Password
        run: |
          net user runneradmin "AriantoLumajang123!@"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Verifikasi IP & Lokasi Akhir
        run: |
          Write-Host "=== MENGECEK IP & LOKASI AKHIR ==="
          try {
              $ipInfo = Invoke-RestMethod -Uri "http://ip-api.com/json" -TimeoutSec 5
              Write-Host "IP: $($ipInfo.query)"
              Write-Host "Negara: $($ipInfo.country)"
          } catch {
              Write-Host "Gagal mengecek IP."
          }

      - name: Tampilkan Info Akses RDP
        run: |
          Write-Host "=== DETAIL AKSES (Arianto Lumajang) ==="
          Write-Host "Username: runneradmin"
          Write-Host "Password: AriantoLumajang123!@"
          try {
              $tsPath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
              if (-not (Test-Path $tsPath)) { $tsPath = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe" }
              if (Test-Path $tsPath) {
                  $tsIp = & $tsPath ip -4 2>&1
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "IP Tailscale (Gunakan jika proxy gagal dan Tailscale aktif): $tsIp"
                  }
              }
          } catch {}

      - name: Keep Alive (Sesi Aktif 6 Jam)
        run: |
          Write-Host "RDP Arianto Lumajang Siap Digunakan."
          while ($true) { Start-Sleep -Seconds 300 }
