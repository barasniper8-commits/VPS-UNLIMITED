name: Windows RDP Pro - Arianto Lumajang

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. INFORMASI SISTEM
      # ==========================================================
      - name: System Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "      WINDOWS RDP PRO - ARIANTO LUMAJANG"
          Write-Host "=============================================="

          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

          Write-Host "Computer : $($cs.Name)"
          Write-Host "Windows  : $($os.Caption)"
          Write-Host "Version  : $($os.Version)"
          Write-Host "CPU      : $($cpu.Name)"
          Write-Host "CPU Core : $($cpu.NumberOfCores)"
          Write-Host "RAM      : $([math]::Round($cs.TotalPhysicalMemory / 1GB,2)) GB"
          Write-Host "Disk     : $([math]::Round($disk.Size / 1GB,2)) GB"
          Write-Host "Free     : $([math]::Round($disk.FreeSpace / 1GB,2)) GB"
          Write-Host "=============================================="

      # ==========================================================
      # 2. UPDATE WINGET
      # ==========================================================
      - name: Prepare Windows Package Manager
        shell: powershell
        run: |
          Write-Host "Memeriksa winget..."

          winget --version

          Write-Host "Winget siap digunakan."

      # ==========================================================
      # 3. INSTALL TAILSCALE
      # ==========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Menginstal Tailscale..."

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

          Start-Sleep -Seconds 10

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
              Write-Host "Tailscale tidak ditemukan."
              exit 1
          }

          Write-Host "Tailscale berhasil diinstal."

      # ==========================================================
      # 4. START TAILSCALE SERVICE
      # ==========================================================
      - name: Start Tailscale Service
        shell: powershell
        run: |
          $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if ($null -eq $service) {
              Write-Host "Service Tailscale tidak ditemukan."
              exit 1
          }

          Set-Service -Name "Tailscale" -StartupType Automatic

          if ($service.Status -ne "Running") {
              Start-Service -Name "Tailscale"
          }

          Start-Sleep -Seconds 5

          Get-Service Tailscale

      # ==========================================================
      # 5. CONNECT TAILSCALE
      # ==========================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: "tskey-auth-kVcRTTmmin11CNTRL-YXBa2FeV9AL9aCEdbBC9AL1p7ETT3tUN4"
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Menghubungkan ke Tailscale..."

          & $ts up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --accept-routes `
            --unattended

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=== TAILSCALE STATUS ==="

          & $ts status

      # ==========================================================
      # 6. AKTIFKAN REMOTE DESKTOP
      # ==========================================================
      - name: Configure Remote Desktop
        shell: powershell
        run: |
          Write-Host "Mengaktifkan Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP berhasil dikonfigurasi."

      # ==========================================================
      # 7. KONFIGURASI USER RDP
      # ==========================================================
      - name: Configure RDP User
        shell: powershell
        env:
          RDP_USERNAME: "runneradmin"
          RDP_PASSWORD: "Ariantocandi12$!"
        run: |
          Write-Host "Menyiapkan user RDP..."

          $username = $env:RDP_USERNAME
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              New-LocalUser `
                -Name $username `
                -Password $password `
                -FullName "RDP Administrator" `
                -Description "RDP User"

          } else {

              Set-LocalUser `
                -Name $username `
                -Password $password
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "User RDP siap."

      # ==========================================================
      # 8. POWER PERFORMANCE
      # ==========================================================
      - name: Optimize Power Settings
        shell: powershell
        run: |
          Write-Host "Mengatur power plan..."

          powercfg /setactive SCHEME_MIN

          powercfg -change -standby-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -disk-timeout-ac 0

          powercfg /hibernate off

          Write-Host "Power configuration selesai."

      # ==========================================================
      # 9. FIREWALL
      # ==========================================================
      - name: Configure Firewall
        shell: powershell
        run: |
          Write-Host "Mengatur Windows Firewall..."

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Select-Object DisplayName, Enabled, Profile

      # ==========================================================
      # 10. INSTALL GOOGLE CHROME
      # ==========================================================
      - name: Install Google Chrome
        shell: powershell
        run: |
          Write-Host "Menginstal Google Chrome..."

          $installer = "$env:TEMP\chrome_installer.exe"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/silent /install" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Write-Host "Chrome selesai."

      # ==========================================================
      # 11. INSTALL 7-ZIP
      # ==========================================================
      - name: Install 7-Zip
        shell: powershell
        run: |
          winget install `
            --id 7zip.7zip `
            -e `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

      # ==========================================================
      # 12. INSTALL GIT
      # ==========================================================
      - name: Install Git
        shell: powershell
        run: |
          winget install `
            --id Git.Git `
            -e `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

      # ==========================================================
      # 13. INSTALL VS CODE
      # ==========================================================
      - name: Install Visual Studio Code
        shell: powershell
        run: |
          winget install `
            --id Microsoft.VisualStudioCode `
            -e `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

      # ==========================================================
      # 14. SYSTEM OPTIMIZATION
      # ==========================================================
      - name: Windows Optimization
        shell: powershell
        run: |
          Write-Host "Optimasi Windows..."

          # Disable beberapa service yang tidak diperlukan
          $services = @(
            "DiagTrack",
            "MapsBroker",
            "Fax"
          )

          foreach ($svc in $services) {

              $obj = Get-Service `
                -Name $svc `
                -ErrorAction SilentlyContinue

              if ($null -ne $obj) {

                  Stop-Service `
                    -Name $svc `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Set-Service `
                    -Name $svc `
                    -StartupType Disabled `
                    -ErrorAction SilentlyContinue
              }
          }

          Write-Host "Optimasi selesai."

      # ==========================================================
      # 15. CHECK RDP PORT
      # ==========================================================
      - name: Check RDP Port
        shell: powershell
        run: |
          Write-Host "Memeriksa port RDP..."

          $result = Test-NetConnection `
            -ComputerName localhost `
            -Port 3389

          Write-Host "Port 3389:"
          Write-Host "TcpTestSucceeded = $($result.TcpTestSucceeded)"

      # ==========================================================
      # 16. TAILSCALE IP
      # ==========================================================
      - name: Display Tailscale IP
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        WINDOWS RDP PRO READY"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "TAILSCALE IPv4:"
          & $ts ip -4

          Write-Host ""
          Write-Host "TAILSCALE STATUS:"
          & $ts status

          Write-Host ""
          Write-Host "RDP PORT:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "RDP USER:"
          Write-Host "runneradmin"

          Write-Host ""
          Write-Host "=============================================="

      # ==========================================================
      # 17. SYSTEM MONITOR
      # ==========================================================
      - name: RDP Health Monitor
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RDP HEALTH MONITOR AKTIF"
          Write-Host "=============================================="

          $end = (Get-Date).AddMinutes(330)

          while ((Get-Date) -lt $end) {

              Write-Host ""
              Write-Host "----------------------------------------------"
              Write-Host "TIME: $(Get-Date)"

              # CPU
              $cpu = Get-CimInstance Win32_Processor |
                     Measure-Object -Property LoadPercentage -Average

              Write-Host "CPU : $([math]::Round($cpu.Average,1))%"

              # RAM
              $os = Get-CimInstance Win32_OperatingSystem

              $totalRam = $os.TotalVisibleMemorySize
              $freeRam = $os.FreePhysicalMemory

              $usedRam = (($totalRam - $freeRam) / $totalRam) * 100

              Write-Host "RAM : $([math]::Round($usedRam,1))%"

              # Disk
              $disk = Get-CimInstance Win32_LogicalDisk `
                -Filter "DeviceID='C:'"

              $diskUsed =
                (($disk.Size - $disk.FreeSpace) / $disk.Size) * 100

              Write-Host "DISK: $([math]::Round($diskUsed,1))%"

              # Tailscale
              $service = Get-Service `
                -Name Tailscale `
                -ErrorAction SilentlyContinue

              Write-Host "Tailscale Service: $($service.Status)"

              if ($service.Status -ne "Running") {

                  Write-Host "Tailscale mati. Restart..."

                  Start-Service Tailscale

                  Start-Sleep -Seconds 5

                  & $ts up --unattended
              }

              # RDP
              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($null -eq $rdp) {

                  Write-Host "RDP port tidak listening."
                  Write-Host "Restarting TermService..."

                  Restart-Service `
                    -Name TermService `
                    -Force `
                    -ErrorAction SilentlyContinue

              } else {

                  Write-Host "RDP: LISTENING"
              }

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Workflow monitoring selesai."
          Write-Host "=============================================="