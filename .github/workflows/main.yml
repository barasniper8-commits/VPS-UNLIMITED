name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:
    inputs:

      tailscale_authkey:
        description: "Tailscale Auth Key"
        required: true
        type: string

      rdp_password:
        description: "Password RDP"
        required: true
        type: string

      session_hours:
        description: "Durasi sesi (jam)"
        required: true
        default: "6"
        type: string

jobs:
  windows-rdp:

    runs-on: windows-latest

    steps:

      # ==========================================================
      # INFO MESIN
      # ==========================================================

      - name: Info Pemilik VPS - Arianto Lumajang
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        VPS RDP ARIANTO LUMAJANG"
          Write-Host "        LUMAJANG - INDONESIA"
          Write-Host "=================================================="

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "=== CPU ==="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "=== RAM ==="

          $RAM = Get-CimInstance Win32_ComputerSystem

          Write-Host ("RAM : {0:N2} GB" -f `
            ($RAM.TotalPhysicalMemory / 1GB))

          Write-Host ""
          Write-Host "=================================================="


      # ==========================================================
      # MASK CREDENTIAL
      # ==========================================================

      - name: Amankan Credential
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host "::add-mask::$env:TS_AUTHKEY"
          Write-Host "::add-mask::$env:RDP_PASSWORD"

          Write-Host "Credential berhasil diamankan dari log."


      # ==========================================================
      # INSTALL TAILSCALE
      # ==========================================================

      - name: Install Tailscale
        shell: pwsh
        run: |

          Write-Host "=================================================="
          Write-Host "             INSTALL TAILSCALE"
          Write-Host "=================================================="

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Install Tailscale gagal."
              exit 1
          }

          Write-Host "Tailscale berhasil diinstall."


      # ==========================================================
      # CONNECT TAILSCALE
      # ==========================================================

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
        run: |

          $TailscaleExe =
            "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $TailscaleExe)) {
              Write-Host "Tailscale tidak ditemukan."
              exit 1
          }

          Start-Service Tailscale `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          & $TailscaleExe up `
            --authkey="$env:TS_AUTHKEY" `
            --accept-routes `
            --unattended

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Tailscale gagal terhubung."
              exit 1
          }

          Write-Host "Tailscale berhasil terhubung."


      # ==========================================================
      # KONFIGURASI RDP
      # ==========================================================

      - name: Konfigurasi Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host "=================================================="
          Write-Host "           KONFIGURASI REMOTE DESKTOP"
          Write-Host "=================================================="

          $Username = "runneradmin"
          $Password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($Password)) {
              Write-Host "Password RDP kosong."
              exit 1
          }

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $UserExists = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -ne $UserExists) {

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword

          }
          else {

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -FullName "Arianto Lumajang" `
                -Description "RDP Arianto Lumajang" `
                -PasswordNeverExpires:$true

          }

          Enable-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          $AdminMembers = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue

          $AlreadyAdmin = $AdminMembers |
            Where-Object {
              $_.Name -match "\\$Username$"
            }

          if ($null -eq $AlreadyAdmin) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $Username

          }

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP berhasil dikonfigurasi."


      # ==========================================================
      # OPTIMASI WINDOWS
      # ==========================================================

      - name: Optimalkan Windows
        shell: pwsh
        run: |

          Write-Host "=================================================="
          Write-Host "           OPTIMASI WINDOWS & MT5"
          Write-Host "=================================================="

          powercfg /setactive SCHEME_MIN

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global rss=enabled

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name "MinAnimate" `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:TEMP\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Optimasi selesai."


      # ==========================================================
      # INSTALL METATRADER 5
      # ==========================================================

      - name: Install MetaTrader 5
        shell: pwsh
        run: |

          Write-Host "=================================================="
          Write-Host "           INSTALL METATRADER 5"
          Write-Host "=================================================="

          $InstallerUrl =
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          $InstallerPath =
            "$env:TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri $InstallerUrl `
            -OutFile $InstallerPath

          if (-not (Test-Path $InstallerPath)) {
              Write-Host "Installer MT5 gagal didownload."
              exit 1
          }

          Start-Process `
            -FilePath $InstallerPath `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "MetaTrader 5 berhasil diinstal."


      # ==========================================================
      # DOWNLOAD FILE TAMBAHAN
      #
      # GANTI DENGAN DIRECT DOWNLOAD URL
      # ==========================================================

      - name: Download File Tambahan
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             DOWNLOAD FILE TAMBAHAN"
          Write-Host "=================================================="

          $DownloadUrl = "GANTI_DENGAN_DIRECT_DOWNLOAD_URL"

          $DownloadDir =
            "$env:USERPROFILE\Downloads"

          $DownloadPath =
            "$DownloadDir\trailing pro.txt"

          New-Item `
            -ItemType Directory `
            -Path $DownloadDir `
            -Force | Out-Null

          Write-Host "Mengunduh file..."

          Invoke-WebRequest `
            -Uri $DownloadUrl `
            -OutFile $DownloadPath `
            -UseBasicParsing

          if (-not (Test-Path $DownloadPath)) {

              Write-Host "Download gagal."
              exit 1

          }

          $FileInfo = Get-Item $DownloadPath

          Write-Host ""
          Write-Host "DOWNLOAD BERHASIL"
          Write-Host "Nama : $($FileInfo.Name)"
          Write-Host ("Ukuran : {0:N2} KB" -f `
            ($FileInfo.Length / 1KB))
          Write-Host "Lokasi : $DownloadPath"

          Write-Host ""
          Write-Host "=================================================="


      # ==========================================================
      # TAILSCALE STATUS
      # ==========================================================

      - name: Tampilkan Informasi Tailscale
        shell: pwsh
        run: |

          $TailscaleExe =
            "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             TAILSCALE STATUS"
          Write-Host "=================================================="

          & $TailscaleExe status

          $IP = & $TailscaleExe ip -4

          Write-Host ""
          Write-Host "IP RDP : $IP"
          Write-Host "Username : runneradmin"
          Write-Host "Password : ********"

          Write-Host ""
          Write-Host "=================================================="


      # ==========================================================
      # KEEP ALIVE
      # ==========================================================

      - name: Keep Alive
        shell: pwsh
        env:
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: |

          $Hours = 0.0

          if (-not [double]::TryParse(
              $env:SESSION_HOURS,
              [ref]$Hours
          )) {
              $Hours = 6
          }

          if ($Hours -le 0) {
              $Hours = 6
          }

          $TotalSeconds =
            [int]($Hours * 3600)

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "          ARIANTO RDP PRO"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "       A           A"
          Write-Host "      / \_________/ \"
          Write-Host "     (     o   o     )"
          Write-Host "      \    \ V /    /"
          Write-Host "       \____\_/____/"
          Write-Host ""

          Write-Host "          ARIANTO RDP PRO"
          Write-Host ""
          Write-Host "     L U M A J A N G"
          Write-Host "       C A N D I P U R O"
          Write-Host ""

          Write-Host "=================================================="
          Write-Host "Durasi sesi : $Hours jam"
          Write-Host "Status      : AKTIF"
          Write-Host "=================================================="

          $StartTime = Get-Date
          $EndTime = $StartTime.AddSeconds($TotalSeconds)

          while ((Get-Date) -lt $EndTime) {

              $Remaining =
                $EndTime - (Get-Date)

              Write-Host (
                "RDP aktif | Sisa waktu: {0:hh\:mm\:ss}" `
                -f $Remaining
              )

              Start-Sleep -Seconds 300
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "       SESI RDP TELAH SELESAI"
          Write-Host "=================================================="