name: ARIANTO RDP PRO - LUMAJANG CANDIPURO

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. ARIANTO RDP PRO BANNER
      # ==========================================================
      - name: ARIANTO RDP PRO
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "                     A           A"
          Write-Host "                    / \_________/ \"
          Write-Host "                   (     o   o     )"
          Write-Host "                    \    \ V /    /"
          Write-Host "                     \____\_/____/"
          Write-Host ""
          Write-Host "                    ARIANTO RDP PRO"
          Write-Host ""
          Write-Host "         L U M A J A N G    C A N D I P U R O"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              WINDOWS RDP PRO"
          Write-Host "=================================================="
          Write-Host ""

          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List

          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object -First 1 Name, NumberOfCores |
            Format-List

          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("RAM: {0:N2} GB" -f `
            ($ram.TotalPhysicalMemory / 1GB))

          $disk = Get-PSDrive C
          Write-Host ("Disk Free: {0:N2} GB" -f `
            ($disk.Free / 1GB))

          Write-Host ""
          Write-Host "ARIANTO RDP PRO READY"


      # ==========================================================
      # 2. CHECK WINGET
      # ==========================================================
      - name: Check Winget
        shell: powershell
        run: |
          Write-Host "Checking winget..."

          $winget = Get-Command winget.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $winget) {
              Write-Warning "winget tidak tersedia."
          }
          else {
              winget --version
          }


      # ==========================================================
      # 3. INSTALL TAILSCALE
      # ==========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Tailscale..."

          $ts = Get-Command tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $ts) {

              Write-Host "Tailscale belum tersedia."

              if (-not (Get-Command winget.exe `
                -ErrorAction SilentlyContinue)) {

                  throw "winget tidak tersedia."
              }

              Write-Host "Installing Tailscale..."

              winget install `
                --id Tailscale.Tailscale `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements
          }

          Start-Sleep -Seconds 5

          $paths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tsPath = $null

          foreach ($p in $paths) {
              if (Test-Path $p) {
                  $tsPath = $p
                  break
              }
          }

          if ($null -eq $tsPath) {

              $found = Get-ChildItem `
                "C:\Program Files",
                "C:\Program Files (x86)" `
                -Filter "tailscale.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($null -ne $found) {
                  $tsPath = $found.FullName
              }
          }

          if ($null -eq $tsPath) {
              throw "tailscale.exe tidak ditemukan."
          }

          Write-Host "Tailscale:"
          Write-Host $tsPath

          "TAILSCALE_PATH=$tsPath" |
            Out-File $env:GITHUB_ENV -Append


      # ==========================================================
      # 4. START TAILSCALE SERVICE
      # ==========================================================
      - name: Start Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $svc = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $svc) {
              throw "Service Tailscale tidak ditemukan."
          }

          if ($svc.Status -ne "Running") {
              Start-Service -Name "Tailscale"
          }

          Start-Sleep -Seconds 5

          Get-Service -Name "Tailscale"


      # ==========================================================
      # 5. CONNECT TAILSCALE
      # ==========================================================
      - name: Connect Tailscale
        shell: powershell
        env:

          # ======================================================
          # tskey-auth-kvYRkh8jPL11CNTRL-3ZmXJNwE5a2UHvKGpR95a2FTaMNQacNDR
          # ======================================================
          TAILSCALE_AUTHKEY: "tskey-auth-kvYRkh8jPL11CNTRL-3ZmXJNwE5a2UHvKGpR95a2FTaMNQacNDR"

        run: |
          $ErrorActionPreference = "Stop"

          $auth = $env:TAILSCALE_AUTHKEY

          if (
              [string]::IsNullOrWhiteSpace($auth) -or
              $auth -eq "ISI_AUTH_KEY_TAILSCALE_KAMU"
          ) {
              throw "TAILSCALE_AUTHKEY belum diisi."
          }

          Write-Host "Connecting Tailscale..."

          & "$env:TAILSCALE_PATH" up `
            --authkey="$auth" `
            --unattended `
            --accept-routes=false

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Tailscale Status:"
          & "$env:TAILSCALE_PATH" status


      # ==========================================================
      # 6. ENABLE REMOTE DESKTOP
      # ==========================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Mengaktifkan Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Type DWord `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop aktif."


      # ==========================================================
      # 7. CREATE RDP USER
      # ==========================================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: "runneradmin"
          RDP_PASSWORD: "AriantoRdpWin2026!A"

        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "Menyiapkan user RDP..."
          Write-Host "Username: $username"

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "Password kosong."
          }

          if ($password.Length -lt 8) {
              throw "Password minimal 8 karakter."
          }

          $hasUpper  = $password -cmatch '[A-Z]'
          $hasLower  = $password -cmatch '[a-z]'
          $hasNumber = $password -match '[0-9]'
          $hasSymbol = $password -match '[^a-zA-Z0-9]'

          if (-not (
              $hasUpper -and
              $hasLower -and
              $hasNumber -and
              $hasSymbol
          )) {
              throw "Password harus memiliki huruf besar, huruf kecil, angka dan simbol."
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              Write-Host "Membuat user baru..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName "Arianto RDP User" `
                -Description "ARIANTO RDP PRO" `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -ErrorAction Stop

          }
          else {

              Write-Host "User sudah ada."
              Write-Host "Mengatur password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword `
                -ErrorAction Stop
          }

          # ------------------------------------------------------
          # Remote Desktop Users
          # ------------------------------------------------------

          $rdpMembers = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue

          $isRdpMember = $rdpMembers |
            Where-Object {
              $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $isRdpMember) {

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $username `
                -ErrorAction Stop
          }

          # ------------------------------------------------------
          # Administrators
          # ------------------------------------------------------

          $adminMembers = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue

          $isAdmin = $adminMembers |
            Where-Object {
              $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $isAdmin) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $username `
                -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       RDP USER BERHASIL DIBUAT"
          Write-Host "=========================================="
          Write-Host "User     : $username"
          Write-Host "Password : $password"
          Write-Host "=========================================="


      # ==========================================================
      # 8. WINDOWS PERFORMANCE
      # ==========================================================
      - name: Optimize Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Mengoptimalkan Windows..."

          powercfg /setactive SCHEME_MIN

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          Write-Host "Performance mode aktif."


      # ==========================================================
      # 9. INSTALL GOOGLE CHROME
      # ==========================================================
      - name: Install Google Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $exists = $false

          foreach ($path in $chromePaths) {

              if (Test-Path $path) {

                  Write-Host "Chrome sudah tersedia."
                  Write-Host $path

                  $exists = $true
                  break
              }
          }

          if (-not $exists) {

              Write-Host "Menginstall Chrome..."

              $installer = "$env:TEMP\chrome_installer.exe"

              Invoke-WebRequest `
                -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
                -OutFile $installer `
                -UseBasicParsing

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item `
                $installer `
                -Force `
                -ErrorAction SilentlyContinue
          }

          Write-Host "Chrome selesai."


      # ==========================================================
      # 10. INSTALL VS CODE
      # ==========================================================
      - name: Install Visual Studio Code
        shell: powershell
        continue-on-error: true
        run: |

          if (Get-Command winget.exe `
            -ErrorAction SilentlyContinue) {

              Write-Host "Installing Visual Studio Code..."

              winget install `
                --id Microsoft.VisualStudioCode `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements
          }
          else {
              Write-Warning "winget tidak tersedia."
          }


      # ==========================================================
      # 11. FIREWALL
      # ==========================================================
      - name: Configure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Mengatur firewall RDP..."

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "ARIANTO RDP TCP 3389" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -ErrorAction SilentlyContinue

          Write-Host "Firewall RDP selesai."


      # ==========================================================
      # 12. CHECK RDP PORT
      # ==========================================================
      - name: Check RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking RDP..."

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {

              Start-Service `
                -Name "TermService"

              Start-Sleep -Seconds 3
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP Service : $((Get-Service TermService).Status)"
          Write-Host "Port 3389   : $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
              throw "RDP port 3389 tidak aktif."
          }

          Write-Host "RDP PORT OK."


      # ==========================================================
      # 13. CONNECTION INFORMATION
      # ==========================================================
      - name: Display RDP Connection
        shell: powershell
        env:
          RDP_USERNAME: "runneradmin"
          RDP_PASSWORD: "AriantoRdpWin2026!A"

        run: |
          $ErrorActionPreference = "Continue"

          Start-Sleep -Seconds 3

          $ip = & "$env:TAILSCALE_PATH" ip -4

          Write-Host ""
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              ARIANTO RDP PRO"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "                     A           A"
          Write-Host "                    / \_________/ \"
          Write-Host "                   (     o   o     )"
          Write-Host "                    \    \ V /    /"
          Write-Host "                     \____\_/____/"
          Write-Host ""
          Write-Host "         L U M A J A N G    C A N D I P U R O"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "                 CONNECTION INFO"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "IP Address : $ip"
          Write-Host "Port       : 3389"
          Write-Host "User       : $env:RDP_USERNAME"
          Write-Host "Password   : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "$ip`:3389"
          Write-Host ""
          Write-Host "=================================================="


      # ==========================================================
      # 14. RDP HEALTH MONITOR
      # ==========================================================
      - name: RDP Health Monitor
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             ARIANTO RDP PRO ONLINE"
          Write-Host "=================================================="
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(330)

          while ((Get-Date) -lt $endTime) {

              Write-Host ""
              Write-Host "--------------------------------------------------"
              Write-Host "Time: $(Get-Date)"
              Write-Host "--------------------------------------------------"

              # --------------------------------------------------
              # TAILSCALE
              # --------------------------------------------------

              $ts = Get-Service `
                -Name "Tailscale" `
                -ErrorAction SilentlyContinue

              if ($null -ne $ts) {

                  if ($ts.Status -ne "Running") {

                      Write-Warning "Tailscale berhenti."
                      Write-Host "Restart Tailscale..."

                      Start-Service `
                        -Name "Tailscale" `
                        -ErrorAction SilentlyContinue

                      Start-Sleep -Seconds 3
                  }
              }

              # --------------------------------------------------
              # RDP SERVICE
              # --------------------------------------------------

              $rdp = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($null -ne $rdp) {

                  if ($rdp.Status -ne "Running") {

                      Write-Warning "TermService berhenti."
                      Write-Host "Restart RDP..."

                      Start-Service `
                        -Name "TermService" `
                        -ErrorAction SilentlyContinue
                  }
              }

              # --------------------------------------------------
              # RDP PORT
              # --------------------------------------------------

              $port = Test-NetConnection `
                -ComputerName "127.0.0.1" `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if ($port.TcpTestSucceeded) {
                  Write-Host "RDP 3389 : ONLINE"
              }
              else {
                  Write-Warning "RDP 3389 : OFFLINE"
              }

              # --------------------------------------------------
              # TAILSCALE IP
              # --------------------------------------------------

              try {

                  $ip = & "$env:TAILSCALE_PATH" ip -4

                  Write-Host "Tailscale : $ip"

              }
              catch {

                  Write-Warning "Tailscale IP tidak tersedia."
              }

              # --------------------------------------------------
              # RAM
              # --------------------------------------------------

              try {

                  $os = Get-CimInstance `
                    Win32_OperatingSystem

                  $freeRam = [math]::Round(
                    $os.FreePhysicalMemory / 1MB,
                    2
                  )

                  Write-Host "Free RAM  : $freeRam GB"

              }
              catch {}

              # --------------------------------------------------
              # DISK
              # --------------------------------------------------

              try {

                  $disk = Get-PSDrive C

                  $freeDisk = [math]::Round(
                    $disk.Free / 1GB,
                    2
                  )

                  Write-Host "Free Disk : $freeDisk GB"

              }
              catch {}

              # --------------------------------------------------
              # WAIT
              # --------------------------------------------------

              Write-Host "Next check: 30 seconds..."

              Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           ARIANTO RDP PRO SELESAI"
          Write-Host "=================================================="