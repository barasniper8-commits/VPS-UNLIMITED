name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: "Masukkan Tailscale Auth Key"
        required: true
        type: string

      rdp_password:
        description: "Masukkan Password RDP"
        required: true
        type: string

      duration_hours:
        description: "Durasi Keep Alive (jam)"
        required: true
        default: "6"
        type: string

jobs:
  windows-rdp:

    runs-on: windows-latest

    steps:

      # =========================================================
      # BANNER
      # =========================================================
      - name: Arianto RDP Banner
        shell: powershell
        run: |
          Write-Host ""
          Write-Host '              .:!!!!!!!!:.'
          Write-Host '           :!!!!!!!!!!!!!!!'
          Write-Host '         .:!!!!!!!!!!UMM$$$$'
          Write-Host '       .:!!!!!!XUWM$$$$$$$$$$P'
          Write-Host '    .<!!!!UN$$$""  $$$$$$$$#'
          Write-Host '    :!!UW$$$$$$$$   4$$$$*'
          Write-Host '     $$$$$$$$$$$  d$$R"'
          Write-Host '      '*$$$$$$$$$$O+#"'
          Write-Host '    ''''''''''
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              RDP WINDOWS 11"
          Write-Host "=================================================="
          Write-Host ""

      # =========================================================
      # INFORMASI MESIN
      # =========================================================
      - name: Informasi VPS
        shell: powershell
        run: |

          $computer = Get-CimInstance Win32_ComputerSystem
          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor |
                 Select-Object -First 1 -ExpandProperty Name

          $start = Get-Date
          $hours = [double]"${{ inputs.duration_hours }}"
          $end = $start.AddHours($hours)

          Write-Host "RAM         : $ramGB GB"
          Write-Host "CPU         : $cpu"
          Write-Host "JAM MULAI   : $($start.ToString('HH:mm:ss')) WIB"
          Write-Host "JAM AKHIR   : $($end.ToString('HH:mm:ss')) WIB"
          Write-Host ""

          Write-Host "----- copyright©arianto2026 ----"

      # =========================================================
      # INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |

          Write-Host "Menginstal Tailscale..."

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements

          # Memperbarui environment path agar file binary Tailscale langsung terdeteksi
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "Tailscale selesai diinstal."

      # =========================================================
      # CONNECT TAILSCALE
      # =========================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              Write-Host "ERROR: Tailscale tidak ditemukan."
              exit 1
          }

          Write-Host "Menyalakan service Tailscale..."

          Start-Service Tailscale -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Menghubungkan ke jaringan Tailscale..."

          & $tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --unattended

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Gagal menghubungkan Tailscale."
              exit 1
          }

          Write-Host "Tailscale berhasil terhubung."

      # =========================================================
      # KONFIGURASI RDP
      # =========================================================
      - name: Aktifkan Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host "Mengaktifkan Remote Desktop..."

          # Mengatur password untuk user runneradmin yang sudah ada di GitHub Actions runner
          $userExists = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $userExists) {

              Write-Host "Membuat user runneradmin..."

              $securePassword = ConvertTo-SecureString `
                "$env:RDP_PASSWORD" `
                -AsPlainText `
                -Force

              New-LocalUser `
                -Name "runneradmin" `
                -Password $securePassword `
                -Description "Arianto RDP User" `
                -PasswordNeverExpires

          } else {

              Write-Host "User runneradmin sudah ada, memperbarui password..."

              $securePassword = ConvertTo-SecureString `
                "$env:RDP_PASSWORD" `
                -AsPlainText `
                -Force

              Set-LocalUser `
                -Name "runneradmin" `
                -Password $securePassword
          }

          # Tambahkan ke Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          # Aktifkan RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # NLA tetap aktif
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Firewall RDP
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP berhasil diaktifkan."

      # =========================================================
      # INFORMASI LOGIN
      # =========================================================
      - name: Tampilkan Informasi RDP
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Start-Sleep -Seconds 3

          $ip = & $tailscale ip -4

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              ARIANTO RDP PRO"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "RDP WINDOWS 11 :"
          Write-Host ""
          Write-Host "USERNAME       : runneradmin"
          Write-Host "PASSWORD       : Gunakan password yang dimasukkan"
          Write-Host "IP TAILSCALE   : $ip"
          Write-Host "PORT           : 3389"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "      RDP SIAP DIGUNAKAN"
          Write-Host "=================================================="
          Write-Host ""

      # =========================================================
      # KEEP ALIVE
      # =========================================================
      - name: Keep Alive
        shell: powershell
        run: |

          $hours = [double]"${{ inputs.duration_hours }}"

          if ($hours -le 0) {
              Write-Host "Durasi harus lebih besar dari 0."
              exit 1
          }

          $seconds = [int]($hours * 3600)

          $startTime = Get-Date
          $endTime = $startTime.AddSeconds($seconds)

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           ARIANTO RDP KEEP ALIVE"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Mulai  : $($startTime.ToString('HH:mm:ss')) WIB"
          Write-Host "Selesai: $($endTime.ToString('HH:mm:ss')) WIB"
          Write-Host "Durasi : $hours jam"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $remaining = $endTime - (Get-Date)

              Write-Host `
                "RDP aktif | Sisa: $($remaining.Hours) jam $($remaining.Minutes) menit $($remaining.Seconds) detik"

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             WAKTU KEEP ALIVE HABIS"
          Write-Host "=================================================="
          Write-Host ""
