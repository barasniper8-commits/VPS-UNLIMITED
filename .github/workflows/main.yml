name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: "Masukkan Tailscale Auth Key"
        required: true
        type: string

      rdp_password:
        description: "Masukkan Password RDP"
        required: true
        type: string

      duration_hours:
        description: "Durasi Keep Alive dalam jam"
        required: true
        default: "6"
        type: string

jobs:
  windows-rdp:
    runs-on: windows-latest

    steps:

      # ==========================================================
      # BANNER
      # ==========================================================
      - name: Arianto RDP Banner
        shell: powershell
        run: |
          Write-Host ''
          Write-Host '              .:!!!!!!!!:.'
          Write-Host '           :!!!!!!!!!!!!!!!'
          Write-Host '         .:!!!!!!!!!!UMM$$$$'
          Write-Host '       .:!!!!!!XUWM$$$$$$$$$$P'
          Write-Host '    .<!!!!UN$$$"  $$$$$$$$#'
          Write-Host '    :!!UW$$$$$$$$   4$$$$*'
          Write-Host '     $$$$$$$$$$$  d$$R"'
          Write-Host '      ''*$$$$$$$$$$O+#"'
          Write-Host '    ''''''''''''''
          Write-Host ''
          Write-Host '=================================================='
          Write-Host '              RDP WINDOWS 11'
          Write-Host '=================================================='
          Write-Host ''

      # ==========================================================
      # INFORMASI MESIN
      # ==========================================================
      - name: Informasi Mesin
        shell: powershell
        run: |

          $computer = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor |
              Select-Object -First 1 -ExpandProperty Name

          $start = Get-Date

          $hours = [double]'${{ inputs.duration_hours }}'

          if ($hours -le 0) {
              Write-Host 'ERROR: Durasi harus lebih besar dari 0 jam.'
              exit 1
          }

          $end = $start.AddHours($hours)

          Write-Host ''
          Write-Host "RAM         : $ramGB GB"
          Write-Host "CPU         : $cpu"
          Write-Host "JAM MULAI   : $($start.ToString('HH:mm:ss')) WIB"
          Write-Host "JAM AKHIR   : $($end.ToString('HH:mm:ss')) WIB"
          Write-Host ''
          Write-Host '----- copyright©arianto2026 ----'
          Write-Host ''

      # ==========================================================
      # INSTALL TAILSCALE
      # ==========================================================
      - name: Install Tailscale
        shell: powershell
        run: |

          Write-Host 'Menginstal Tailscale...'

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Host 'ERROR: Instalasi Tailscale gagal.'
              exit 1
          }

          Write-Host 'Tailscale berhasil diinstal.'

      # ==========================================================
      # CONNECT TAILSCALE
      # ==========================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
        run: |

          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          if (!(Test-Path $tailscale)) {
              Write-Host 'ERROR: tailscale.exe tidak ditemukan.'
              exit 1
          }

          Write-Host 'Menyalakan service Tailscale...'

          Start-Service Tailscale -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host 'Menghubungkan ke Tailscale...'

          & $tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --unattended

          if ($LASTEXITCODE -ne 0) {
              Write-Host 'ERROR: Gagal menghubungkan Tailscale.'
              exit 1
          }

          Write-Host 'Tailscale berhasil terhubung.'

      # ==========================================================
      # SETUP RDP
      # ==========================================================
      - name: Setup Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host 'Mengkonfigurasi Windows RDP...'

          $securePassword = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name 'runneradmin' `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              Write-Host 'Membuat user runneradmin...'

              New-LocalUser `
                -Name 'runneradmin' `
                -Password $securePassword `
                -Description 'Arianto RDP User' `
                -PasswordNeverExpires

          }
          else {

              Write-Host 'User runneradmin sudah ada.'

              Set-LocalUser `
                -Name 'runneradmin' `
                -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'runneradmin' `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Write-Host 'Windows RDP berhasil diaktifkan.'

      # ==========================================================
      # TAMPILKAN INFORMASI LOGIN
      # ==========================================================
      - name: Tampilkan IP Tailscale dan Login
        shell: powershell
        run: |

          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          Start-Sleep -Seconds 3

          $ip = (& $tailscale ip -4).Trim()

          $computer = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          $start = Get-Date

          $hours = [double]'${{ inputs.duration_hours }}'

          $end = $start.AddHours($hours)

          Write-Host ''
          Write-Host '              .:!!!!!!!!:.'
          Write-Host '           :!!!!!!!!!!!!!!!'
          Write-Host '         .:!!!!!!!!!!UMM$$$$'
          Write-Host '       .:!!!!!!XUWM$$$$$$$$$$P'
          Write-Host '    .<!!!!UN$$$"  $$$$$$$$#'
          Write-Host '    :!!UW$$$$$$$$   4$$$$*'
          Write-Host '     $$$$$$$$$$$  d$$R"'
          Write-Host '      ''*$$$$$$$$$$O+#"'
          Write-Host '    ''''''''''''''
          Write-Host ''

          Write-Host '=================================================='
          Write-Host '              RDP WINDOWS 11'
          Write-Host '=================================================='
          Write-Host ''
          Write-Host "RAM         : $ramGB GB"
          Write-Host "JAM MULAI   : $($start.ToString('HH:mm:ss')) WIB"
          Write-Host "JAM AKHIR   : $($end.ToString('HH:mm:ss')) WIB"
          Write-Host ''
          Write-Host 'USERNAME    : runneradmin'
          Write-Host 'PASSWORD    : Password dari input Run workflow'
          Write-Host "IP TAILSCALE: $ip"
          Write-Host 'PORT        : 3389'
          Write-Host ''
          Write-Host 'STATUS      : RDP SIAP'
          Write-Host ''
          Write-Host '----- copyright©arianto2026 ----'
          Write-Host ''
          Write-Host '=================================================='

      # ==========================================================
      # KEEP ALIVE
      # ==========================================================
      - name: Keep Alive
        shell: powershell
        run: |

          $hours = [double]'${{ inputs.duration_hours }}'

          if ($hours -le 0) {
              Write-Host 'ERROR: Durasi tidak valid.'
              exit 1
          }

          $totalSeconds = [int]($hours * 3600)

          $startTime = Get-Date

          $endTime = $startTime.AddSeconds($totalSeconds)

          Write-Host ''
          Write-Host '=================================================='
          Write-Host '             ARIANTO RDP PRO'
          Write-Host '             KEEP ALIVE AKTIF'
          Write-Host '=================================================='
          Write-Host ''
          Write-Host "Mulai  : $($startTime.ToString('HH:mm:ss')) WIB"
          Write-Host "Akhir  : $($endTime.ToString('HH:mm:ss')) WIB"
          Write-Host "Durasi : $hours jam"
          Write-Host ''

          while ((Get-Date) -lt $endTime) {

              $remaining = $endTime - (Get-Date)

              $h = [math]::Floor($remaining.TotalHours)
              $m = $remaining.Minutes
              $s = $remaining.Seconds

              Write-Host "RDP AKTIF | Sisa waktu: ${h}h ${m}m ${s}s"

              Start-Sleep -Seconds 60
          }

          Write-Host ''
          Write-Host '=================================================='
          Write-Host '          WAKTU KEEP ALIVE SELESAI'
          Write-Host '=================================================='