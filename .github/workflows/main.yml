name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: "Masukkan Tailscale Auth Key"
        required: true
        type: string

      rdp_password:
        description: "Masukkan Password RDP"
        required: true
        type: string

      duration_hours:
        description: "Durasi Keep Alive dalam jam"
        required: true
        default: "6"
        type: string


jobs:
  windows-rdp:

    runs-on: windows-latest

    steps:

      # ==========================================================
      # BANNER
      # ==========================================================
      - name: Banner Arianto RDP
        shell: powershell
        run: |

          $banner = @'
              .:!!!!!!!!:.
           :!!!!!!!!!!!!!!!
         .:!!!!!!!!!!UMM$$$$
       .:!!!!!!XUWM$$$$$$$$$$P
    .<!!!!UN$$$"  $$$$$$$$#
    :!!UW$$$$$$$$   4$$$$*
     $$$$$$$$$$$  d$$R"
      '*$$$$$$$$$$O+#"
    '''''''''

    RDP WINDOWS 11 :
'@

          Write-Host $banner
          Write-Host ""

      # ==========================================================
      # INFORMASI MESIN
      # ==========================================================
      - name: Informasi Mesin
        shell: powershell
        run: |

          $computer = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor |
              Select-Object -First 1 -ExpandProperty Name

          $startTime = Get-Date

          $hours = 6

          $endTime = $startTime.AddHours($hours)

          Write-Host "=================================================="
          Write-Host "          INFORMASI RDP WINDOWS 11"
          Write-Host "=================================================="
          Write-Host ""

          Write-Host "RAM         : $ramGB GB"
          Write-Host "CPU         : $cpu"
          Write-Host "JAM MULAI   : $($startTime.ToString('HH:mm:ss')) WIB"
          Write-Host "JAM AKHIR   : $($endTime.ToString('HH:mm:ss')) WIB"

          Write-Host ""
          Write-Host "----- copyright©arianto2026 -----"
          Write-Host ""

      # ==========================================================
      # INSTALL TAILSCALE
      # ==========================================================
      - name: Install Tailscale
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "              INSTALL TAILSCALE"
          Write-Host "=================================================="

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Winget gagal."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              Write-Host "Tailscale tidak ditemukan."
              exit 1
          }

          Write-Host "Tailscale berhasil diinstal."

      # ==========================================================
      # CONNECT TAILSCALE
      # ==========================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Menyalakan service Tailscale..."

          Start-Service Tailscale `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Menghubungkan ke Tailscale..."

          & $tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --unattended

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Gagal menghubungkan Tailscale."
              exit 1
          }

          Write-Host "Tailscale berhasil terhubung."

      # ==========================================================
      # AKTIFKAN RDP
      # ==========================================================
      - name: Konfigurasi Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host "=================================================="
          Write-Host "             KONFIGURASI WINDOWS RDP"
          Write-Host "=================================================="

          $securePassword = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              Write-Host "Membuat user runneradmin..."

              New-LocalUser `
                -Name "runneradmin" `
                -Password $securePassword `
                -Description "Arianto RDP User" `
                -PasswordNeverExpires

          }
          else {

              Write-Host "User runneradmin sudah tersedia."

              Set-LocalUser `
                -Name "runneradmin" `
                -Password $securePassword
          }

          # Tambahkan user ke Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          # Aktifkan RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Aktifkan Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Firewall RDP
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host ""
          Write-Host "RDP berhasil diaktifkan."

      # ==========================================================
      # TAMPILKAN IP DAN LOGIN
      # ==========================================================
      - name: Tampilkan Informasi Login RDP
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Start-Sleep -Seconds 3

          $ip = & $tailscale ip -4

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              ARIANTO RDP PRO"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "RDP WINDOWS 11 :"
          Write-Host ""
          Write-Host "RAM         : otomatis"
          Write-Host "USERNAME    : runneradmin"
          Write-Host "PASSWORD    : password dari Run workflow"
          Write-Host "IP TAILSCALE: $ip"
          Write-Host "PORT        : 3389"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "               RDP SIAP DIGUNAKAN"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "----- copyright©arianto2026 -----"
          Write-Host ""

      # ==========================================================
      # KEEP ALIVE
      # ==========================================================
      - name: Keep Alive
        shell: powershell
        run: |

          $hours = 6

          $totalSeconds = [int]($hours * 3600)

          $startTime = Get-Date

          $endTime = $startTime.AddSeconds($totalSeconds)

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              ARIANTO RDP KEEP ALIVE"
          Write-Host "=================================================="
          Write-Host ""

          Write-Host "JAM MULAI : $($startTime.ToString('HH:mm:ss')) WIB"
          Write-Host "JAM AKHIR : $($endTime.ToString('HH:mm:ss')) WIB"
          Write-Host "DURASI     : $hours JAM"

          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $now = Get-Date

              $remaining = $endTime - $now

              Write-Host (
                "RDP AKTIF | SISA {0:00}:{1:00}:{2:00}" -f
                [math]::Floor($remaining.TotalHours),
                $remaining.Minutes,
                $remaining.Seconds
              )

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           KEEP ALIVE SELESAI"
          Write-Host "=================================================="