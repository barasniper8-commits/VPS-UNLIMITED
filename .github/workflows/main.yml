name: Windows RDP Arianto Lumajang

on:
  workflow_dispatch:
    inputs:

      tailscale_authkey:
        description: "Tailscale Auth Key"
        required: true
        type: string

      rdp_password:
        description: "Password RDP"
        required: true
        type: string

      session_hours:
        description: "Durasi sesi (jam)"
        required: true
        default: "6"
        type: string


jobs:
  windows-rdp:

    runs-on: windows-latest

    steps:

      # ==========================================================
      # INFO MESIN
      # ==========================================================

      - name: Info Pemilik VPS - Arianto Lumajang
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        VPS RDP ARIANTO LUMAJANG"
          Write-Host "        LUMAJANG - INDONESIA"
          Write-Host "=================================================="
          Write-Host ""

          Write-Host "=== INFORMASI WINDOWS ==="

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "=== CPU ==="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "=== RAM ==="

          $RAM = Get-CimInstance Win32_ComputerSystem

          Write-Host ("RAM : {0:N2} GB" -f ($RAM.TotalPhysicalMemory / 1GB))

          Write-Host ""
          Write-Host "=================================================="


      # ==========================================================
      # MASK CREDENTIAL
      # ==========================================================

      - name: Amankan Credential
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host "::add-mask::$env:TS_AUTHKEY"
          Write-Host "::add-mask::$env:RDP_PASSWORD"

          Write-Host "Credential berhasil diamankan dari log."


      # ==========================================================
      # INSTALL TAILSCALE
      # ==========================================================

      - name: Install Tailscale
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             INSTALL TAILSCALE"
          Write-Host "=================================================="

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host "Tailscale berhasil diinstall."


      # ==========================================================
      # START TAILSCALE
      # ==========================================================

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
        run: |

          Write-Host ""
          Write-Host "Mengaktifkan service Tailscale..."

          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $TailscaleExe)) {

            Write-Host "Tailscale executable tidak ditemukan."
            exit 1

          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Write-Host "Menghubungkan ke jaringan Tailscale..."

          & $TailscaleExe up `
            --authkey="$env:TS_AUTHKEY" `
            --accept-routes `
            --unattended

          if ($LASTEXITCODE -ne 0) {

            Write-Host "Tailscale gagal terhubung."
            exit 1

          }

          Write-Host "Tailscale berhasil terhubung."


      # ==========================================================
      # KONFIGURASI RDP
      # ==========================================================

      - name: Konfigurasi Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           KONFIGURASI REMOTE DESKTOP"
          Write-Host "=================================================="

          $Username = "runneradmin"
          $Password = $env:RDP_PASSWORD

          # ------------------------------------------------------
          # Validasi password
          # ------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($Password)) {

            Write-Host "Password RDP kosong."
            exit 1

          }

          # ------------------------------------------------------
          # Buat SecureString
          # ------------------------------------------------------

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          # ------------------------------------------------------
          # Cek user
          # ------------------------------------------------------

          $UserExists = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -ne $UserExists) {

            Write-Host "User runneradmin sudah ada."
            Write-Host "Mengubah password user..."

            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword

          }
          else {

            Write-Host "Membuat user runneradmin..."

            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -FullName "Arianto Lumajang" `
              -Description "RDP Arianto Lumajang" `
              -PasswordNeverExpires:$true

          }

          # ------------------------------------------------------
          # Pastikan user aktif
          # ------------------------------------------------------

          Enable-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          # ------------------------------------------------------
          # Tambahkan Administrators
          # ------------------------------------------------------

          Write-Host "Memeriksa group Administrators..."

          $AdminMembers = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue

          $AlreadyAdmin = $AdminMembers |
            Where-Object {
              $_.Name -match "\\$Username$"
            }

          if ($null -eq $AlreadyAdmin) {

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $Username

            Write-Host "runneradmin ditambahkan ke Administrators."

          }
          else {

            Write-Host "runneradmin sudah menjadi Administrator."

          }

          # ------------------------------------------------------
          # Aktifkan RDP
          # ------------------------------------------------------

          Write-Host "Mengaktifkan Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # ------------------------------------------------------
          # Network Level Authentication
          # ------------------------------------------------------

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # ------------------------------------------------------
          # Firewall
          # ------------------------------------------------------

          Write-Host "Mengaktifkan Firewall Remote Desktop..."

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP berhasil dikonfigurasi."


      # ==========================================================
      # OPTIMASI WINDOWS
      # ==========================================================

      - name: Optimalkan Windows
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           OPTIMASI WINDOWS"
          Write-Host "=================================================="

          # ------------------------------------------------------
          # High Performance
          # ------------------------------------------------------

          Write-Host "Mengatur Power Plan..."

          powercfg /setactive SCHEME_MIN

          # ------------------------------------------------------
          # Nonaktifkan Sleep
          # ------------------------------------------------------

          Write-Host "Menonaktifkan Sleep..."

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # ------------------------------------------------------
          # TCP Optimization
          # ------------------------------------------------------

          Write-Host "Mengoptimalkan TCP..."

          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global rss=enabled

          # ------------------------------------------------------
          # Bersihkan TEMP
          # ------------------------------------------------------

          Write-Host "Membersihkan TEMP..."

          Remove-Item `
            "$env:TEMP\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "C:\Windows\Temp\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          # ------------------------------------------------------
          # Recycle Bin
          # ------------------------------------------------------

          Write-Host "Membersihkan Recycle Bin..."

          Clear-RecycleBin `
            -Force `
            -ErrorAction SilentlyContinue

          # ------------------------------------------------------
          # Kurangi beberapa service diagnostik
          # ------------------------------------------------------

          Write-Host "Mengoptimalkan service..."

          $Services = @(
            "DiagTrack",
            "MapsBroker"
          )

          foreach ($ServiceName in $Services) {

            $Service = Get-Service `
              -Name $ServiceName `
              -ErrorAction SilentlyContinue

            if ($null -ne $Service) {

              Stop-Service `
                -Name $ServiceName `
                -Force `
                -ErrorAction SilentlyContinue

              Set-Service `
                -Name $ServiceName `
                -StartupType Disabled `
                -ErrorAction SilentlyContinue

            }

          }

          Write-Host ""
          Write-Host "Optimasi Windows selesai."


      # ==========================================================
      # CEK TAILSCALE
      # ==========================================================

      - name: Tampilkan Informasi Tailscale
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             TAILSCALE STATUS"
          Write-Host "=================================================="

          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "Status:"
          & $TailscaleExe status

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              IP TAILSCALE"
          Write-Host "=================================================="

          $IP = & $TailscaleExe ip -4

          Write-Host ""
          Write-Host "IP RDP:"
          Write-Host $IP

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              LOGIN RDP"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Computer : $IP"
          Write-Host "Username : runneradmin"
          Write-Host "Password : ********"
          Write-Host ""

          Write-Host "=================================================="


      # ==========================================================
      # KEEP ALIVE
      # ==========================================================

      - name: Keep Alive
        shell: pwsh
        env:
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: |

          $Hours = 0

          if (-not [double]::TryParse(
            $env:SESSION_HOURS,
            [ref]$Hours
          )) {

            $Hours = 6

          }

          if ($Hours -le 0) {
            $Hours = 6
          }

          $TotalSeconds = [int]($Hours * 3600)

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "          ARIANTO RDP PRO"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "       A           A"
          Write-Host "      / \_________/ \"
          Write-Host "     (     o   o     )"
          Write-Host "      \    \ V /    /"
          Write-Host "       \____\_/____/"
          Write-Host ""
          Write-Host "          ARIANTO RDP PRO"
          Write-Host ""
          Write-Host "     L U M A J A N G"
          Write-Host "       C A N D I P U R O"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "Durasi sesi : $Hours jam"
          Write-Host "Status      : AKTIF"
          Write-Host "=================================================="

          $StartTime = Get-Date
          $EndTime = $StartTime.AddSeconds($TotalSeconds)

          while ((Get-Date) -lt $EndTime) {

            $Remaining = $EndTime - (Get-Date)

            Write-Host (
              "RDP aktif | Sisa waktu: {0:hh\:mm\:ss}" -f $Remaining
            )

            Start-Sleep -Seconds 300

          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "       SESI RDP TELAH SELESAI"
          Write-Host "=================================================="